[project]
name = "local-model-studio-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "opencv-python-headless>=4.10.0",
  "Pillow>=10.4.0",
  "psutil>=5.9.0",
  "transformers>=4.45.0",
  "safetensors>=0.4.5",
  "torch>=2.4.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "respx>=0.21.0"
]
opencv = [
  "opencv-python>=4.10.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
